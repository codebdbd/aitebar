# Задание на переработку PromptBuilderService

## 1. Цель

Переработать `PromptBuilderService`, чтобы он создавал профессиональные промпты с учётом реального типа конечной задачи.

Текущая реализация использует одну общую инструкцию для программирования, изображений, текстов, видео, аудио, анализа и идей. Такой подход неверен, поскольку эти промпты предназначены для разных нейросетей и требуют разной структуры.

Каждая категория должна получить полностью самостоятельный системный промпт.

## 2. Основные проблемы текущей реализации

Необходимо устранить следующие проблемы:

1. `BaseInstruction` навязывает всем категориям одинаковую структуру:

   * роль;
   * цель;
   * контекст;
   * требования;
   * процесс;
   * формат ответа;
   * критерии качества.

2. Для изображений создаются формальные задания вместо прямого визуального описания.

3. Видео и аудио ошибочно объединены в одну категорию.

4. Анализ и генерация идей ошибочно объединены в одну категорию.

5. Категория аудио имеет слишком широкое назначение. На практике она должна создавать только описания музыкального стиля для поля `Styles` на Suno.

6. Для всех категорий используется одинаковая температура и одинаковый диапазон выходных токенов.

## 3. Новые категории

Заменить текущий enum:

```csharp
public enum PromptBuilderCategory
{
    Programming = 0,
    Images = 1,
    Texts = 2,
    VideoAudio = 3,
    AnalysisIdeas = 4
}
```

на:

```csharp
public enum PromptBuilderCategory
{
    Programming = 0,
    Images = 1,
    Texts = 2,
    Video = 3,
    Analysis = 4,
    Music = 5,
    Ideas = 6
}
```

Числовые значения выбраны с учётом совместимости:

* старое значение `3` преобразуется в `Video`;
* старое значение `4` преобразуется в `Analysis`;
* новые категории `Music` и `Ideas` получают новые значения.

Это предотвращает ситуацию, когда сохранённая категория анализа после обновления неожиданно превращается в музыку.

## 4. Названия категорий в интерфейсе

Использовать следующие названия:

| Enum          | Название         |
| ------------- | ---------------- |
| `Programming` | Программирование |
| `Images`      | Изображения      |
| `Texts`       | Тексты           |
| `Video`       | Видео            |
| `Music`       | Музыка для Suno  |
| `Analysis`    | Анализ           |
| `Ideas`       | Идеи             |

Порядок отображения в интерфейсе:

1. Программирование
2. Изображения
3. Тексты
4. Видео
5. Музыка для Suno
6. Анализ
7. Идеи

Порядок интерфейса не должен зависеть от числовых значений enum.

## 5. Назначение категорий

### Программирование

Создаёт подробное задание для нейросети, работающей с кодом:

* разработка приложения, сайта, бота, утилиты или скрипта;
* изменение существующего проекта;
* исправление ошибки;
* анализ кода;
* рефакторинг;
* проектирование архитектуры;
* тестирование;
* безопасность;
* производительность.

### Изображения

Создаёт прямой промпт для генерации или редактирования изображения:

* фотографии;
* иллюстрации;
* логотипы;
* иконки;
* постеры;
* обложки;
* рекламные изображения;
* интерфейсы;
* изменение существующих изображений.

Результат должен описывать изображение, а не содержать роль, цель, workflow или критерии приёмки.

### Тексты

Создаёт задание для текстовой нейросети:

* написание текста;
* редактирование;
* исправление ошибок;
* перевод;
* сокращение;
* пересказ;
* изменение стиля;
* создание статьи, письма, документа, сценария или публикации.

### Видео

Создаёт прямой промпт для генератора или редактора видео:

* text-to-video;
* image-to-video;
* редактирование видео;
* анимация;
* рекламная сцена;
* кинематографический кадр;
* последовательность сцен.

### Музыка для Suno

Создаёт англоязычное описание музыкального стиля для поля `Styles` на Suno.

Категория не создаёт:

* текст песни;
* название;
* сценарий;
* озвучку;
* подкаст;
* звуковой эффект;
* техническое задание.

### Анализ

Создаёт задание на исследование, сравнение, проверку или принятие решения:

* исследование темы;
* анализ документов;
* анализ данных;
* сравнение вариантов;
* оценка рисков;
* проверка утверждений;
* выявление причин;
* подготовка выводов и рекомендаций.

### Идеи

Создаёт задание на генерацию вариантов:

* идеи программ;
* функции продукта;
* названия;
* концепции;
* рекламные идеи;
* способы решения проблемы;
* варианты развития проекта;
* сюжеты и творческие направления.

## 6. Архитектурные изменения

Полностью удалить:

```csharp
private const string BaseInstruction = ...
```

Удалить формирование системного промпта через:

```csharp
BaseInstruction + "\n\nCATEGORY GUIDANCE:\n" + ...
```

Каждая категория должна использовать отдельную законченную системную инструкцию.

Дублирование базовых правил допустимо и намеренно. Это не даёт изменениям одной категории случайно повлиять на остальные.

## 7. Готовые системные промпты

### 7.1. ProgrammingInstruction

```csharp
private const string ProgrammingInstruction = """
Convert the user's brief into one complete, professional, ready-to-use prompt for an AI system that works with software development.

Return only the finished prompt. Do not greet the user, explain your work, offer alternatives, ask questions, or continue a dialogue.

Preserve the language of the user's brief unless the user explicitly requests another language.

Silently determine the type of programming task: new development, modification of an existing project, debugging, code review, refactoring, architecture, testing, security analysis, performance optimization, deployment, documentation, or technical explanation.

Preserve every explicit requirement from the brief. Do not invent a programming language, framework, platform, architecture, database, API, library, file structure, business rule, credential, measurement, or external dependency that the user did not provide or clearly imply.

Do not add a decorative role such as “You are a senior developer” unless the user explicitly requests a role or a specific area of expertise is essential to the task.

For new development, describe only the relevant requirements:
- the intended result;
- target platform and technology stack when known;
- required functionality;
- user interaction;
- data handling;
- integrations;
- error handling;
- edge cases;
- non-functional requirements;
- expected deliverables;
- acceptance criteria.

For changes to an existing project, require the AI to analyze the supplied code before making changes, preserve the current architecture and existing behavior unless a change is explicitly requested, avoid unrelated refactoring, and clearly identify every modified file.

For debugging, include the observed behavior, expected behavior, known error information, reproduction conditions, and the required form of the fix when these details are available.

For code review, define the review scope and request concrete findings with locations, consequences, priorities, and corrected solutions. Do not request speculative problems without evidence in the supplied code.

For security-related tasks, prohibit destructive actions, unsafe assumptions, hidden backdoors, credential exposure, and weakening of existing protections.

Use headings, lists, code blocks, workflow steps, and acceptance criteria only when they improve execution of the specific task. Keep the prompt proportional to the complexity of the user's brief.

If an essential fact is missing and cannot be inferred safely, insert a concise square-bracket placeholder such as [target platform] or [path to the project] instead of asking a question.

The result must be a prompt for performing the programming task, not the implementation of the task itself.
""";
```

