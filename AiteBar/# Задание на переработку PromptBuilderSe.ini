Идеи
Создание заданий для поиска идей, концепций и вариантов решения.
```

4. Проверить все:

   * `switch`;
   * привязки;
   * конвертеры;
   * локализацию;
   * настройки;
   * сохранение выбранной категории;
   * аналитику;
   * тесты;
   * отображаемые иконки;
   * обработчики кнопок.

## 13. Миграция сохранённых настроек

Если категория сохраняется как число:

* `0`, `1`, `2` оставить без изменений;
* старое `3` считать категорией `Video`;
* старое `4` считать категорией `Analysis`;
* `Music` и `Ideas` доступны только после обновления.

Если категория сохраняется строкой:

```text
VideoAudio -> Video
AnalysisIdeas -> Analysis
```

После миграции сохранить новое значение.

Не допускать автоматического преобразования старого `AnalysisIdeas` в `Music`.

## 14. Требования к ответу модели

Для всех категорий:

* возвращается один готовый промпт;
* отсутствуют приветствия;
* отсутствуют объяснения результата;
* отсутствуют предложения продолжить диалог;
* отсутствуют вопросы пользователю;
* сохраняются требования исходного запроса;
* отсутствующие факты не выдумываются;
* длина результата соответствует сложности запроса.

Дополнительные требования:

### Изображения

Запрещены:

```text
Role:
Objective:
Context:
Requirements:
Workflow:
Quality criteria:
You are a professional artist...
```

### Видео

Запрещены роли, технические задания и объяснения процесса генерации.

### Музыка

Результат:

* только на английском;
* только один абзац;
* предназначен для `Styles`;
* без текста песни;
* без названия;
* без пояснений;
* без вариантов;
* без заголовка `Style:`;
* без Markdown.

## 15. Обязательные тесты

### Тест 1. Изображение

Ввод:

```text
Мрачный советский рабочий стоит перед огромным паровозом, красно-чёрная гамма
```

Правильный результат должен сразу описывать изображение.

В результате не должно быть:

```text
Role
Objective
Requirements
Create a detailed prompt
You are an artist
```

### Тест 2. Редактирование изображения

Ввод:

```text
Замени лицо человека на лицо со второго фото. Всё остальное не менять.
```

Промпт должен явно потребовать:

* взять лицо со второго референса;
* сохранить позу;
* сохранить одежду;
* сохранить фон;
* сохранить композицию;
* сохранить освещение;
* не менять остальные элементы.

### Тест 3. Музыка для Suno

Ввод:

```text
Мрачный индустриальный рок, тяжёлые гитары, мужской вокал, мощный припев
```

Допустимый результат:

```text
Dark industrial rock with heavy distorted guitars, mechanical percussion, deep male vocals, tense verses, a powerful anthemic chorus, cold metallic textures, dense production, and a bleak dystopian atmosphere.
```

Результат не должен содержать:

* русский текст;
* название песни;
* текст песни;
* заголовок;
* несколько вариантов;
* объяснение;
* роль;
* фразу о Suno.

### Тест 4. Видео

Ввод:

```text
Оживи фотографию. Мужчина медленно поворачивает голову к камере. Камера неподвижна.
```

Результат должен описывать только движение мужчины и сохранение исходного кадра.

Нельзя добавлять:

* движение камеры;
* смену фона;
* новых персонажей;
* дополнительные действия;
* монтаж;
* речь.

### Тест 5. Программирование

Ввод:

```text
Сделай утилиту Windows, которая рекурсивно собирает фотографии из папки и создаёт коллаж A4 без обрезки фотографий.
```

Результат должен сформировать техническое задание с функциональными требованиями, обработкой ошибок и критериями готовности.

Нельзя самостоятельно выбирать стек, если пользователь его не указал.

### Тест 6. Анализ

Ввод:

```text
Сравнить два варианта архитектуры приложения и выбрать более надёжный.
```

Промпт должен требовать единые критерии сравнения, риски, преимущества, недостатки и обоснованный вывод.

### Тест 7. Идеи

Ввод:

```text
Придумать функции для утилиты быстрого перевода сообщений.
```

Промпт должен требовать разные идеи, а не аналитическое исследование рынка.

## 16. Критерии готовности

Задача считается выполненной, если:

1. В enum существует семь отдельных категорий.
2. `VideoAudio` полностью удалена.
3. `AnalysisIdeas` полностью удалена.
4. `Audio` не используется — вместо неё существует `Music`.
5. Общий `BaseInstruction` удалён.
6. Каждая категория имеет независимый системный промпт.
7. Изображения не получают роли и структуру технического задания.
8. Видео не смешивается с музыкой или другими аудиозадачами.
9. Музыкальная категория создаёт только английское описание для Suno Styles.
10. Анализ не смешивается с генерацией идей.
11. Старые сохранённые значения корректно мигрируют.
12. Все семь категорий проходят обязательные тесты.
13. Очистка ответа и скрытие reasoning продолжают работать.
14. Проект собирается без предупреждений и ошибок.
15. Не остаётся ссылок на старые категории.
