name: Build & Test

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore .\AiteBar.sln

      - name: Build Release
        run: dotnet build .\AiteBar.sln -c Release --no-restore

      - name: Run non-WPF tests
        shell: pwsh
        run: |
          dotnet test .\AiteBar.Tests\AiteBar.Tests.csproj -c Release --no-build --filter "Category!=WPF"
          if ($LASTEXITCODE -ne 0) {
            throw "Non-WPF tests failed with exit code $LASTEXITCODE."
          }
        timeout-minutes: 15

      - name: Run WPF tests in isolated hosts
        shell: pwsh
        run: |
          $testLines = dotnet test .\AiteBar.Tests\AiteBar.Tests.csproj -c Release --no-build -t --filter "Category=WPF"
          $wpfClasses = $testLines | Where-Object { $_ -match '^\s*AiteBar\.Tests\.(\w+)\.' } | ForEach-Object { $Matches[1] } | Select-Object -Unique | Sort-Object
          if (-not $wpfClasses -or $wpfClasses.Count -eq 0) {
            throw "No WPF tests were discovered with Category=WPF."
          }
          Write-Host "Discovered $($wpfClasses.Count) WPF test classes: $($wpfClasses -join ', ')"
          foreach ($class in $wpfClasses) {
            Write-Host "=== Running isolated tests for $class ==="
            dotnet test .\AiteBar.Tests\AiteBar.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~AiteBar.Tests.$class."
            if ($LASTEXITCODE -ne 0) {
              throw "WPF test class $class failed with exit code $LASTEXITCODE."
            }
          }
        timeout-minutes: 20
