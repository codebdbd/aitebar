name: Build & Test

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore .\AiteBar.sln

      - name: Build Release
        run: dotnet build .\AiteBar.sln -c Release --no-restore

      - name: Run non-WPF tests
        shell: pwsh
        run: |
          $wpfClasses = @(
            "ClipboardManagerWindowBehaviorTests",
            "CommandButtonStyleTests",
            "FormControlHeightTests",
            "MainWindowIconConverterOrientationTests",
            "ZenEditorWindowBehaviorTests",
            "QuickNoteWindowCloseTests",
            "QuickNoteWindowFormattingTests",
            "TextProcessingWindowLayoutTests"
          )
          $filter = ($wpfClasses | ForEach-Object { "FullyQualifiedName!~$_" }) -join "&"
          dotnet test .\AiteBar.Tests\AiteBar.Tests.csproj -c Release --no-build --filter $filter
          if ($LASTEXITCODE -ne 0) {
            throw "Non-WPF tests failed with exit code $LASTEXITCODE."
          }
        timeout-minutes: 15

      - name: Run WPF tests in isolated hosts
        shell: pwsh
        run: |
          $wpfClasses = @(
            "ClipboardManagerWindowBehaviorTests",
            "CommandButtonStyleTests",
            "FormControlHeightTests",
            "MainWindowIconConverterOrientationTests",
            "ZenEditorWindowBehaviorTests",
            "QuickNoteWindowCloseTests",
            "QuickNoteWindowFormattingTests",
            "TextProcessingWindowLayoutTests"
          )
          foreach ($class in $wpfClasses) {
            dotnet test .\AiteBar.Tests\AiteBar.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~$class"
            if ($LASTEXITCODE -ne 0) {
              throw "WPF test class $class failed with exit code $LASTEXITCODE."
            }
          }
        timeout-minutes: 15
